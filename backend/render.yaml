services:
  - type: web
    name: busan-localhub-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
