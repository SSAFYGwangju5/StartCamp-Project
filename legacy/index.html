<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busan LocalHub</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">BUSAN LOCALHUB</p>
          <h1>부산 여행 허브</h1>
          <p>관광지, 축제, 여행코스와 커뮤니티를 한 화면에서 둘러보세요.</p>
        </div>
      </header>

      <nav class="category-tabs" aria-label="주요 메뉴">
        <button class="tab-button active" type="button" data-view="spots">관광지</button>
        <button class="tab-button" type="button" data-view="events">축제/행사</button>
        <button class="tab-button" type="button" data-view="courses">여행코스</button>
        <button class="tab-button" type="button" data-view="community">커뮤니티</button>
      </nav>

      <main class="content-layout">
        <section class="main-panel" aria-live="polite">
          <div class="panel-header">
            <div>
              <p class="section-kicker" id="viewKicker">관광지</p>
              <h2 id="viewTitle">부산 관광지 리스트</h2>
            </div>
            <p class="count-label" id="viewCount">불러오는 중</p>
          </div>

          <div id="viewBody" class="view-body"></div>
        </section>

        <aside class="chat-panel">
          <div class="chat-header">
            <p class="section-kicker">챗봇</p>
            <h2>부산 여행 도우미</h2>
          </div>
          <div id="chatLog" class="chat-log">
            <p class="bot-message">궁금한 부산 여행 정보를 물어보세요.</p>
          </div>
          <form id="chatForm" class="chat-form">
            <label class="sr-only" for="chatInput">챗봇 프롬프트</label>
            <input id="chatInput" type="text" placeholder="부산 가볼만한 곳 추천해줘" />
            <button type="submit">전송</button>
          </form>
        </aside>
      </main>

      <footer class="source-note">
        이 서비스는 한국관광공사 Tour API(TourAPI 4.0)의 데이터를 활용하였습니다.
        출처: 한국관광공사
        <a href="https://www.data.go.kr/data/15101578/openapi.do">공공데이터포털</a>
        / 라이선스: 공공누리 제3유형
      </footer>
    </div>

    <script src="./src/app.js"></script>
  </body>
</html>
